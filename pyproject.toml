[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-report"
version = "0.1.0"
description = "Generate configurable photo PDF reports from image folders using XeLaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Eid Alkhaldi, PhD."}]
keywords = ["python", "automation", "latex", "arabic", "pdf-generation", "reporting", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.14"]

[project.scripts]
auto-report = "auto_report.cli:main"

[tool.setuptools.packages.find]
include = ["auto_report*"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
